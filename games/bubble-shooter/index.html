<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble Shooter - Golden Hour</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="bubbleshooter.css">
    <script src="../../games-audio.js"></script>
</head>
<body>
    <div class="game-header">
        <a href="../../index.html" class="back-btn">⬅ Back to Golden Hour</a>
        <h2>Bubble Shooter</h2>
        <button class="btn btn-secondary btn-audio-toggle">🔊 Music: On</button>
    </div>
    
    <div class="game-wrapper">
        <div class="game-area">
            <div class="scoreboard">
                <div>Score: <span id="score-val" class="score-val">0</span></div>
            </div>

            <canvas id="bubble-canvas" width="400" height="500"></canvas>

            <div class="controls-info">
                Move mouse to <strong>Aim</strong>, Left Click to <strong>Shoot</strong>.
            </div>

            <button class="btn btn-primary" id="btn-restart" style="margin-top: 1rem;">Restart Game</button>
        </div>
    </div>
    
    <script src="bubbleshooter.js"></script>
</body>
</html>
