<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sliding Puzzle - Golden Hour</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="slidingpuzzle.css">
    <script src="../../games-audio.js"></script>
</head>
<body>
    <div class="game-header">
        <a href="../../index.html" class="back-btn">⬅ Back to Golden Hour</a>
        <h2>Sliding Puzzle</h2>
        <button class="btn btn-secondary btn-audio-toggle">🔊 Music: On</button>
    </div>
    
    <div class="game-wrapper">
        <div class="game-area">
            <div class="scoreboard">
                <div>Moves: <span id="moves-val" class="score-val">0</span></div>
            </div>

            <div class="board-outer">
                <div id="puzzle-board" class="puzzle-board"></div>
            </div>

            <div class="status-box" id="status-box">
                Click tiles next to the empty slot to slide them.
            </div>

            <button class="btn btn-primary" id="btn-restart" style="margin-top: 1rem;">Restart Game</button>
        </div>
    </div>
    
    <script src="slidingpuzzle.js"></script>
</body>
</html>
