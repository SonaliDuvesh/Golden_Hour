<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Golden Hour</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="game2048.css">
    <script src="../../games-audio.js"></script>
</head>
<body>
    <div class="game-header">
        <a href="../../index.html" class="back-btn">⬅ Back to Golden Hour</a>
        <h2>2048</h2>
        <button class="btn btn-secondary btn-audio-toggle">🔊 Music: On</button>
    </div>
    
    <div class="game-wrapper">
        <div class="game-area">
            <div class="scoreboard">
                <div>Score: <span id="score-val" class="score-val">0</span></div>
                <div>High Score: <span id="high-score-val" class="score-val">0</span></div>
            </div>

            <div class="board-outer">
                <div id="grid-container" class="grid-container">
                    
                </div>
            </div>

            <div class="controls-info">
                Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to slide tiles.
            </div>

            <button class="btn btn-primary" id="btn-restart" style="margin-top: 1rem;">Restart Game</button>
        </div>
    </div>
    
    <script src="game2048.js"></script>
</body>
</html>
